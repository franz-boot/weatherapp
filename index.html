<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generátor obsahu pro sociální sítě | ChatGPT nástroj</title>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="src/css/style.css">
</head>

<body>
    <div class="winter-bg"></div>
    <div class="mountains">
        <div class="mountain mountain-1"></div>
        <div class="mountain mountain-2"></div>
        <div class="mountain mountain-3"></div>
        <div class="mountain mountain-4"></div>
    </div>
    <canvas id="snowCanvas"></canvas>

    <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLanguage('cs')">CZ</button>
        <button class="lang-btn" onclick="setLanguage('de')">DE</button>
    </div>

    <div class="dashboard">
        <div class="header">
            <h1 data-i18n="title">Předpověď sněhu</h1>
            <p data-i18n="subtitle">14denní předpověď a upozornění</p>
        </div>

        <div class="card search-card">
            <div class="card-title" data-i18n="searchLocation">Vyhledat místo</div>
            <div class="search-container">
                <input type="text" class="search-input" id="cityInput" data-i18n-placeholder="searchPlaceholder"
                    placeholder="Zadejte název města..." autocomplete="off" />
                <div class="autocomplete-list" id="autocompleteList"></div>
            </div>
            <div class="search-buttons">
                <button class="btn" onclick="searchCity()" data-i18n="search">Hledat</button>
                <button class="btn btn-secondary" onclick="useMyLocation()" data-i18n="myLocation">Moje poloha</button>
            </div>
            <div class="current-location" id="currentLocation">
                <div class="label" data-i18n="selectedLocation">Vybrané místo</div>
                <div class="name" id="locationName"></div>
            </div>
            <div class="location-map hidden" id="locationMapSection">
                <div class="map-header">
                    <span data-i18n="locationMap">Lokalita na mapě</span>
                    <a id="locationMapLink" href="#" target="_blank" rel="noopener" data-i18n="openMap">Otevřít mapu</a>
                </div>
                <div id="locationMap" aria-label="Mapa vybrané lokality"></div>
            </div>
        </div>

        <div class="card forecast-card hidden" id="forecastCard">
            <div class="card-title" data-i18n="forecast14days">14denní předpověď</div>
            <div id="forecastContent">
                <div class="loading" data-i18n="loading">Načítání</div>
            </div>

            <div class="chart-container hidden" id="chartContainer">
                <h3 data-i18n="snowAccumulation">Akumulace sněhu</h3>
                <div class="chart-wrapper">
                    <canvas id="snowChart"></canvas>
                </div>
                <div class="total-snow-summary" id="totalSnowSummary">
                    <div class="total-snow-highlight">
                        <span class="stat-value" id="totalSnow">0 cm</span>
                        <span class="stat-label" data-i18n="total14days">Celkem za 14 dní</span>
                    </div>
                    <div class="total-snow-details">
                        <div class="total-snow-stat">
                            <span class="stat-value" id="snowDaysCount">0</span>
                            <span class="stat-label" data-i18n="snowDays">Dní se sněhem</span>
                        </div>
                        <div class="total-snow-stat">
                            <span class="stat-value" id="maxSnowDay">0 cm</span>
                            <span class="stat-label" data-i18n="maxSnow">Max za den</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="share-section hidden" id="shareSection">
                <div class="share-buttons">
                    <button class="share-btn native" onclick="nativeShare()">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z" />
                        </svg>
                        <span data-i18n="share">Sdílet</span>
                    </button>
                    <button class="share-btn copy" onclick="copyToClipboard()">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
                        </svg>
                        <span data-i18n="copy">Kopírovat</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="card alert-card hidden" id="alertCard">
            <div class="card-title" data-i18n="snowAlerts">Upozornění na sníh</div>

            <div class="alert-toggle">
                <label class="toggle" for="alertToggle">
                    <input type="checkbox" id="alertToggle" onchange="toggleAlerts()">
                    <span class="slider"></span>
                </label>
                <span data-i18n="enableAlerts">Povolit upozornění</span>
            </div>

            <div class="threshold-section">
                <label data-i18n="alertThreshold">Upozornit když sníh přesáhne:</label>
                <div class="threshold-input">
                    <input type="number" id="threshold" value="1" min="0" step="0.5" placeholder="1"
                        onchange="checkAlerts()">
                    <span>cm</span>
                </div>
            </div>

            <div class="email-section">
                <h4 data-i18n="emailNotifications">E-mailová upozornění</h4>
                <div class="email-input">
                    <input type="email" id="emailAddress" data-i18n-placeholder="emailPlaceholder"
                        placeholder="vas@email.cz" />
                    <button class="btn btn-small" onclick="sendEmailAlert()" data-i18n="send">Odeslat</button>
                </div>
                <div class="email-status" id="emailStatus"></div>
            </div>

            <div class="alert-banner" id="alertBanner">
                <h4 data-i18n="snowAlert">Upozornění na sníh!</h4>
                <p id="alertMessage"></p>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Application Script -->
    <script src="src/js/app.js"></script>
</body>

</html>
